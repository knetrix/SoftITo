<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GamerZone - Oyuncu Paneli</title>
    <style>
      /* CSS Reset ve CSS Değişkenler */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --arka-plan: #0f1015;
        --kart-arka-plan: rgba(24, 26, 36, 0.75);
        --kart-hover-bg: rgba(32, 35, 49, 0.9);
        --kenarlik: #262938;
        --yazi-ana: #ffffff;
        --yazi-gri: #9ca3af;
        --yesil: #22c55e;
        --sari: #eab308;
        --mor: #a855f7;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--arka-plan);
        color: var(--yazi-ana);
        padding: 30px 16px;
        min-height: 100vh;
      }

      .sayfa-kapsayici {
        max-width: 1100px;
        margin: 0 auto;
      }

      /* Başlık Alanı */
      .header-bolumu {
        text-align: center;
        margin-bottom: 35px;
      }

      /* Sonsuz (Infinite) CSS Animasyonu */
      .canli-durum {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 20px;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: var(--yesil);
        font-size: 13px;
        margin-bottom: 12px;
      }

      .nokta-animasyon {
        width: 8px;
        height: 8px;
        background-color: var(--yesil);
        border-radius: 50%;
        animation: yanSon 1.6s infinite ease-in-out;
      }

      @keyframes yanSon {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      /* Akışkan Başlık Clamp() */
      h1 {
        font-size: clamp(1.8rem, 4vw, 2.7rem);
        margin-bottom: 8px;
      }

      .alt-yazi {
        color: var(--yazi-gri);
        font-size: 14px;
      }

      /* Mobile-First CSS Grid */
      /* Varsayılan: Mobil Ekran (1 Sütun) */
      .oyun-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      /* Tablet Ekran (Min-Width: 768px): 2 Sütun */
      @media (min-width: 768px) {
        .oyun-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* Masaüstü Ekran (Min-Width: 1024px): 4 Sütun */
      @media (min-width: 1024px) {
        .oyun-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Glassmorphism & Hover / Transition */
      .oyun-karti {
        background: var(--kart-arka-plan);
        border: 1px solid var(--kenarlik);
        border-radius: 14px;
        padding: 20px;
        min-height: 175px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;

        /* Glassmorphism Efekti */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        /* Hover Yumuşatma */
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease;
      }

      /* Hover Efekti (translateY ve box-shadow) */
      .oyun-karti:hover {
        transform: translateY(-5px);
        background: var(--kart-hover-bg);
        border-color: #3f4459;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
      }

      .kart-ust {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .kart-etiket {
        font-size: 12px;
        font-weight: 600;
        color: var(--yazi-gri);
        text-transform: uppercase;
      }

      .kart-ikon {
        font-size: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--kenarlik);
        border-radius: 8px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .kart-deger {
        font-size: 28px;
        font-weight: 700;
        margin: 10px 0;
      }

      .kart-alt {
        font-size: 13px;
        font-weight: 500;
      }

      .kart-alt.yesil {
        color: var(--yesil);
      }
      .kart-alt.sari {
        color: var(--sari);
      }
      .kart-alt.mor {
        color: var(--mor);
      }

      /* Skeleton Loading Animasyonu */
      .iskelet-animasyon {
        background: linear-gradient(
          90deg,
          #1b1d28 25%,
          #2a2d3e 50%,
          #1b1d28 75%
        );
        background-size: 200% 100%;
        animation: parlama 1.6s infinite ease-in-out;
        border-radius: 6px;
      }

      @keyframes parlama {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .iskelet-yazi {
        width: 55%;
        height: 14px;
      }

      .iskelet-kutu {
        width: 36px;
        height: 36px;
        border-radius: 8px;
      }

      .iskelet-sayi {
        width: 75%;
        height: 30px;
        margin: 10px 0;
      }

      .iskelet-alt-yazi {
        width: 60%;
        height: 12px;
      }
    </style>
  </head>

  <body>
    <div class="sayfa-kapsayici">
      <!-- Başlık ve Canlılık Durumu -->
      <header class="header-bolumu">
        <div class="canli-durum">
          <span class="nokta-animasyon"></span>
          <span>Sunucular Aktif & Çevrimiçi</span>
        </div>
        <h1>GamerZone İstatistik Paneli</h1>
      </header>

      <!-- Grid Kartları -->
      <main class="oyun-grid">
        <!-- Kart 1: Çevrimiçi Oyuncu -->
        <div class="oyun-karti">
          <div class="kart-ust">
            <span class="kart-etiket">Anlık Oyuncu</span>
            <div class="kart-ikon">🎮</div>
          </div>
          <div class="kart-deger">142.850</div>
          <div class="kart-alt yesil">↑ %12 dünden fazla</div>
        </div>

        <!-- Kart 2: Aktif Karşılaşma -->
        <div class="oyun-karti">
          <div class="kart-ust">
            <span class="kart-etiket">Canlı Maçlar</span>
            <div class="kart-ikon">⚔️</div>
          </div>
          <div class="kart-deger">850 Lobi</div>
          <div class="kart-alt sari">Sezon 3 Dereceli Mod</div>
        </div>

        <!-- Kart 3: Ortalama Gecikme -->
        <div class="oyun-karti">
          <div class="kart-ust">
            <span class="kart-etiket">Ağ Gecikmesi</span>
            <div class="kart-ikon">⚡</div>
          </div>
          <div class="kart-deger">24 ms</div>
          <div class="kart-alt mor">TR / İstanbul Sunucusu</div>
        </div>

        <!-- Kart 4: Bonus - Skeleton Loading (Yükleniyor Durumu) -->
        <div class="oyun-karti">
          <div class="kart-ust">
            <div class="iskelet-animasyon iskelet-yazi"></div>
            <div class="iskelet-animasyon iskelet-kutu"></div>
          </div>
          <div class="iskelet-animasyon iskelet-sayi"></div>
          <div class="iskelet-animasyon iskelet-alt-yazi"></div>
        </div>
      </main>
    </div>
  </body>
</html>
