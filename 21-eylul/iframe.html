<html lang="en">
  <head>
    <title>iframe</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        background: khaki;
        padding: 20px;
        max-width: 600px;
        margin: auto;
      }

      .card {
        background-color: blueviolet;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 52px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      h3 {
        margin-top: 0;
        color: #1e293b;
      }

      iframe {
        width: 100%;
        border-radius: 8px;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>iframe Harita ve Video</h3>

      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/3TXcmpHcVZQ?si=mT9rJxauIrr_jFWY"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>

      <br />

      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12022.898334761569!2d29.03932628327896!3d41.11870570652596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14caca7ef84c460d%3A0x6835674d2add2018!2zxLBzdGlueWUsIFNhcsSxeWVyl8Swc3RHbmJ1bA!5e0!3m2!1str!2str!4v1789995689829!5m2!1str!2str"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </body>
</html>
