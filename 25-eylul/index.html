<script>
  // 1. Değer Kopyalama.
  let sayi1 = 100;
  let sayi2 = sayi1;
  sayi2 = 250;

  console.log("sayi1", sayi1);
  console.log("sayi2", sayi2);

  // 2. Dizi Kopyalama.
  const istasyonlarA = ["Kadıköy DC", "Beşiktaş AC"];
  const istasyonlarB = istasyonlarA;
  istasyonlarB.push("Üsküdar Ultra DC");

  console.log("İstasyonlar A", istasyonlarA);
  console.log("İstasyonlar B", istasyonlarB);
  console.log(istasyonlarA === istasyonlarB);

  // 2.1 Doğru Dizi Kopyalama Yöntemi.
  const bagimsizKopya = [...istasyonlarA];
  bagimsizKopya.push("Maltepe Hızlı");
  console.log("Orjinal Liste", istasyonlarA.length);
  console.log("Yeni Klon Liste", bagimsizKopya.length);

  // Dizi Elemanlarımız: Ham Veri Seti.

  const sarjIstasyonlari = [
    {
      id: "IST-01",
      lokasyon: "Zorlu Center",
      tip: "DC",
      gucKw: 180,
      durum: "Aktif",
      seansAdet: 45,
      tarifeTL: 12,
    },
    {
      id: "IST-02",
      lokasyon: "Akasya AVM ",
      tip: "AC",
      gucKw: 22,
      durum: "Aktif",
      seansAdet: 11,
      tarifeTL: 9,
    },
    {
      id: "IST-03",
      lokasyon: "Kanyon AVM",
      tip: "DC",
      gucKw: 120,
      durum: "Aktif",
      seansAdet: 22,
      tarifeTL: 12,
    },
    {
      id: "IST-04",
      lokasyon: "Vadi İstanbul",
      tip: "AC",
      gucKw: 22,
      durum: "Aktif",
      seansAdet: 33,
      tarifeTL: 8.5,
    },
    {
      id: "IST-05",
      lokasyon: "Mall Of İstanbul",
      tip: "DC",
      gucKw: 300,
      durum: "Aktif",
      seansAdet: 55,
      tarifeTL: 15,
    },
  ];

  // 1. map ile Döngü Veriyi Dönüştürür ve Her Elemanı İşler. Aynı Boyutta Yeni Dizi Döner.
  const istasyonOzetleri = sarjIstasyonlari.map((ist) => {
    return `${ist.lokasyon} (${ist.tip} - ${ist.gucKw}) -> ${ist.durum.toUpperCase()}`;
  });
  console.log("Map Sonucu", istasyonOzetleri);

  const sadeceLokasyonlar = sarjIstasyonlari.map((ist) => ist.lokasyon);
  console.log("Lakasyonlar", sadeceLokasyonlar);

  // 2. filter() Şartı Sağlayanları Ayıklar, YENİ Dizi Döner.

  const aktifDcİstasyonlar = sarjIstasyonlari.filter(
    (ist) => ist.tip === "DC" && ist.durum === "Aktif",
  );
  console.table(aktifDcİstasyonlar);

  // 3. find ve findIndex (Tekil Eleman Arama)
  const bulunan = sarjIstasyonlari.find((ist) => ist.id === "IST-03");
  console.log("Bulunan İstasyon", bulunan.lokasyon, bulunan.gucKw, "KW");

  // 4. some ve every - Mantıksal Kontroller (Boolean Döner).

  const bakimdaOlanVarmi = sarjIstasyonlari.some(
    (ist) => ist.durum === "bakim",
  );
  const hepsiAktifmi = sarjIstasyonlari.every((ist) => ist.durum === "Aktif");
  console.log("Bakımda Olan Var Mı", bakimdaOlanVarmi);
  console.log("Tüm İstasyonlar Aktif Mi", hepsiAktifmi);

  // 5. reduce() Toplama.
  const toplamSeans = sarjIstasyonlari.reduce((aku, istasyon) => {
    return aku + istasyon.seansAdet;
  }, 0); //Başlangıç değeri 0
  console.log("Toplam Yapılan Şarj Seansı", toplamSeans);

  // 6. Zincir: Filter -> map -> reduce
  // Aktif DC İstasyonlarının Toplam Anlık Maksimum Güç Kapasitesi Nedir?
  const aktifDcToplamGuc = sarjIstasyonlari
    .filter((ist) => ist.durum === "Aktif" && ist.tip === "DC")
    .map((ist) => ist.gucKw)
    .reduce((toplam, guc) => toplam + guc, 0);

  console.log("Aktif DC Toplam Güç Kapasitesi", aktifDcToplamGuc, "Kw");

  const pahaliAktifLokasyonlar = sarjIstasyonlari
    .filter((ist) => ist.durum === "Aktif" && ist.tarifeTL > 10)
    .map((ist) => ist.lokasyon);
  console.log("Sonuç", pahaliAktifLokasyonlar);
</script>
